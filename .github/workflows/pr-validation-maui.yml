name: eShop Pull Request Validation - .NET MAUI

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  push:
    branches:
      - main
    paths:
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:  
  test:
    runs-on: windows-latest    
    steps:
      - uses: actions/checkout@v4
      # global.json selects the .NET 11 SDK the repository builds with; the client app and its unit tests target
      # .NET 10, whose runtime the tests run on.
      - name: Setup .NET (global.json and the .NET 10 runtime)
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Update Workloads
        run: dotnet workload update

      - name: Install Workloads
        shell: pwsh
        run: |
          dotnet workload install android
          dotnet workload install ios
          dotnet workload install maccatalyst
          dotnet workload install maui

      - name: Build 
        run: dotnet build src/ClientApp/ClientApp.csproj
        
      - name: Test
        run: dotnet test --project tests/ClientApp.UnitTests/ClientApp.UnitTests.csproj --no-progress --output detailed