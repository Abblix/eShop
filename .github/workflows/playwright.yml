name: Playwright Tests for eShop
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The SDK that global.json selects builds the identity server for .NET 11; the other services run on .NET 10.
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        global-json-file: global.json
        dotnet-version: '10.0.x'
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    # The identity provider serves its protocol endpoints over HTTPS only, so the services call
    # each other over HTTPS with the development certificate and have to trust it.
    # Exit code 4 means trusted for .NET through OpenSSL but not for browsers through NSS, which
    # is enough: Playwright accepts the certificate on its own. OpenSSL finds the trust only
    # through SSL_CERT_DIR.
    - name: Trust the development certificate
      run: |
        set +e
        dotnet dev-certs https --trust
        rc=$?
        set -e
        case $rc in
          0|4) ;;
          *) exit "$rc" ;;
        esac
        echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
    - name: Run Playwright tests
      run: npm run test:e2e
      env:
        USERNAME1: bob
        PASSWORD: Pass123$
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
